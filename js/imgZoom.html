<script>
var img = document.body.getElementsByTagName("img");
var i = 0;
while (i < img.length) {
    img[i].setAttribute("data-action", "zoom");
    i++;
}

// Bold "Figure X.Y:" labels in auto-generated figure captions
var captions = document.querySelectorAll("p.caption");
for (var j = 0; j < captions.length; j++) {
    captions[j].innerHTML = captions[j].innerHTML.replace(
        /^(Figure \d+\.\d+:\s)/,
        '<strong>$1</strong>'
    );
}
</script>
<script src="https://cdn.jsdelivr.net/npm/zoom-vanilla.js/dist/zoom-vanilla.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/zoom-vanilla.js/dist/zoom.css" rel="stylesheet">
